# Release builds run R8 by default (Flutter), and the minify worker
# runs inside this daemon. Small heaps (e.g. 1024m/384m) can exhaust
# metaspace and kill the daemon on R8-heavy graphs. 2048m/512m is safe on
# any dev machine; RAM-constrained debug-only CI may lower it.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
# Jetifier disabled — every dependency in these projects is
# already AndroidX (play-services 21.x, androidx.*, Flutter 3.47); running the
# jetifier just blows heap on the ~300 MB flutter embedding jar for nothing.
android.enableJetifier=false
android.nonTransitiveRClass=false
android.nonFinalResIds=true
# (AGP 9 + Flutter 3.47): built-in Kotlin is OFF because AGP 9.4.1
# embeds Kotlin 2.2.10, which is below Flutter's minimum (2.2.20). KGP 2.4.20
# is declared in settings.gradle and applied to every AGP module by the
# Flutter Gradle plugin itself — modules must NOT apply `kotlin-android`.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
